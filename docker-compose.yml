services:
  app:
    build: .
    # 夜間ルーチン（SKILL）が docker exec で参照する固定名。compose 既定の
    # <dir>-app-1 だとマシンごとに名前がずれ、サブ機で参照が壊れるため明示する。
    container_name: music-editer-dev
    ports:
      # ホスト側は 127.0.0.1 に限定する。
      # "5173:5173" だと 0.0.0.0 にバインドされ、同じ LAN 上の他端末から
      # 開発サーバー（ソースコードを配信する）へ届いてしまうため。
      # コンテナ内の --host はポートマッピングに必要なのでそのまま残す。
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev -- --host

  # PDF楽譜 → .mxl 変換API（Issue #487）。Audiveris を積んだ重いイメージなので、
  # 普段の `docker compose up`（アプリだけ）では起動しない。使うときだけ
  #   docker compose --profile omr up omr
  # で起動し、アプリ側は VITE_OMR_API_URL=http://localhost:8080 を指定する。
  omr:
    build: ./server/omr
    profiles: ["omr"]
    container_name: music-editer-omr
    ports:
      # アプリと同じく 127.0.0.1 に限定する（LAN の他端末へ変換APIを晒さない）
      - "127.0.0.1:8080:8080"
    environment:
      # 共有トークン（#493）。未設定ならローカル開発向けに検査なし。
      # 試用公開（Tunnel で外へ出す）時は必ず設定する（server/omr/README.md）
      - OMR_API_TOKEN=${OMR_API_TOKEN:-}

volumes:
  node_modules: