name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (vitest)
        run: npm test

      - name: Lint (ratchet)
        run: npm run lint:ratchet -- --check

      - name: Build
        run: npm run build
