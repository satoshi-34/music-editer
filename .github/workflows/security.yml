name: セキュリティ基礎スキャン

# 決定的（＝実行するたび同じ結果になる）スキャナだけをここに置く。
# AIによるレビューは非決定的なので別系統で行い、このワークフローには混ぜない。
# テスト・lint・build は ci.yml が担当するので、ここでは重複させない。

on:
  pull_request:
  push:
    branches: [main, release]
  schedule:
    # 依存の新しい脆弱性は、コードを変更していなくても増える。JST 月曜 10:00
    - cron: "0 1 * * 1"

permissions:
  contents: read
  # CodeQL の結果を Security タブへ送るために必要
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: シークレット検出（gitleaks）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 過去のコミットに紛れた鍵も検出したいので全履歴を取る
          fetch-depth: 0
      - name: gitleaks
        # gitleaks-action は組織アカウントでライセンスを要求するため、
        # ライセンス不要な公式 Docker イメージを直接使う
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code 1

  deps:
    name: 依存の既知脆弱性（npm audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # PR を止めるのは critical だけにする。high で止めると upstream 待ちの
      # 未修正脆弱性で CI が恒常的に赤くなり、赤の意味が失われるため。
      # 受容中のものは docs/security/accepted-risks.md に記録する。
      - name: critical のみ PR をブロック
        run: npm audit --audit-level=critical
      - name: high 以上の一覧（表示のみ・失敗させない）
        if: always()
        run: npm audit --audit-level=high || true

  sast:
    name: 静的解析（semgrep OSS）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: semgrep
        # ルールセットは明示的に固定する（--config=auto はクラウド側の
        # ルール変更で結果が変わり、決定的でなくなるため使わない）。
        # サーバーを持たないブラウザアプリなので sql-injection 等は入れない。
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep:latest \
            semgrep scan --error --metrics=off \
            --config p/typescript \
            --config p/react \
            --config p/secrets \
            --config p/xss \
            /src

  codeql:
    name: CodeQL（このリポジトリは public のため無料で使える）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended は既定より広い（誤検知も増えるが、
          # ブラウザアプリで守るものが限られるぶん許容できる）
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
